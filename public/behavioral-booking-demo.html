<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Behavioral Appointment Booking Demo</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#f8fafc,#eef3f8);min-height:100vh}.shell{max-width:860px;margin:auto;padding:24px 16px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;box-shadow:0 14px 40px #0f172a12;overflow:hidden}.head{padding:22px 24px;border-bottom:1px solid #edf1f5}.head h1{margin:0 0 6px;font-size:27px}.head p{margin:0;color:#667085}.demo{display:inline-block;margin-top:10px;padding:5px 9px;border-radius:999px;background:#fff7ed;color:#9a3412;font-size:11px;font-weight:800}.body{padding:24px}.dates{display:flex;gap:7px;overflow:auto;padding-bottom:7px}.date{border:1px solid #dfe5ed;background:#fff;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer;white-space:nowrap}.date.on{background:#172033;color:#fff}.meta{display:flex;justify-content:space-between;align-items:center;margin:16px 0 10px;color:#667085;font-size:12px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.slot{position:relative;border:1px solid #dfe5ed;border-radius:10px;padding:11px 5px;text-align:center;font-weight:850;background:#fff;cursor:pointer;transition:.18s}.slot.available:hover{border-color:#16a34a;background:#f0fdf4}.slot.booked{background:#f4f5f7;color:#98a2b3;text-decoration:line-through}.slot.held{background:#fff7ed;color:#9a3412}.slot.opened{background:#ecfdf3;color:#166534;border-color:#86efac;animation:pulse 1s ease 2}.slot small{display:block;font-size:9px;margin-top:3px;text-decoration:none}.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;color:#667085;font-size:11px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:#d0d5dd}.dot.a{background:#86efac}.dot.h{background:#fdba74}.recovery{margin-top:18px;border:1px solid #bbf7d0;background:#f0fdf4;border-radius:14px;padding:15px}.recovery h3{margin:0 0 5px;font-size:16px}.recovery p{margin:0 0 11px;color:#475467;font-size:12px}.premium{border:0;background:#172033;color:white;border-radius:10px;padding:11px 14px;font-weight:850;cursor:pointer}.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:#fff;border-radius:10px;padding:11px 14px;font-size:12px;opacity:0;transform:translateY(8px);transition:.2s}.toast.on{opacity:1;transform:none}@keyframes pulse{50%{transform:scale(1.03)}}@media(max-width:620px){.grid{grid-template-columns:repeat(3,1fr)}.body{padding:18px}}
</style></head><body><div class="shell"><div class="card"><div class="head"><h1>Explore all appointment times</h1><p>Tap any time. We’ll check the best matching doctor for you.</p><span class="demo">DEMO INVENTORY · simulated activity</span></div><div class="body"><div id="dates" class="dates"></div><div class="meta"><strong id="dayTitle">Today</strong><span id="availability"></span></div><div id="slots" class="grid"></div><div class="legend"><span><i class="dot a"></i>Available</span><span><i class="dot"></i>Booked</span><span><i class="dot h"></i>Temporarily held</span></div><div id="recovery" class="recovery" hidden><h3 id="recoveryTitle"></h3><p id="recoveryText"></p><button id="premiumBtn" class="premium"></button></div></div></div></div><div id="toast" class="toast"></div><script>
const times=['8:00 am','8:30 am','9:00 am','9:30 am','10:00 am','10:30 am','11:00 am','11:30 am','12:00 pm','12:30 pm','1:00 pm','1:30 pm','2:00 pm','2:30 pm','4:00 pm','4:30 pm','5:00 pm','5:30 pm','6:00 pm','6:30 pm','7:00 pm','7:30 pm','8:00 pm','8:30 pm','9:00 pm','9:30 pm'];
const doctors=['Dr. Ananya','Dr. Kiran','Dr. Meera']; const principal='Dr. Arjun Rao · Principal Dentist'; let day=0; let states={}; let interest={};
function seeded(d,i){return (d*37+i*19+11)%100} function protectedTime(t){return /^8:|^8:30|12:|1:|4:|5:|6:|7:|8:|9:/.test(t)}
function initDay(d){if(states[d])return; states[d]=times.map((t,i)=>{const s=seeded(d,i); if(protectedTime(t))return s<18?'booked':'available'; return s<31?'booked':s<36?'held':'available'}); let occupied=states[d].filter(x=>x!=='available').length; const target=Math.ceil(times.length*.27); for(let i=0;occupied<target&&i<times.length;i++){if(states[d][i]==='available'&&!protectedTime(times[i])){states[d][i]='booked';occupied++}}}
function labelDate(d){const x=new Date();x.setDate(x.getDate()+d);return d===0?'Today':d===1?'Tomorrow':x.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}
function renderDates(){dates.innerHTML='';for(let d=0;d<10;d++){const b=document.createElement('button');b.className='date '+(d===day?'on':'');b.textContent=labelDate(d);b.onclick=()=>{day=d;initDay(day);render()};dates.appendChild(b)}}
function render(){initDay(day);renderDates();dayTitle.textContent=labelDate(day);slots.innerHTML='';const open=states[day].filter(x=>x==='available'||x==='opened').length;availability.textContent=open+' times available';states[day].forEach((s,i)=>{const b=document.createElement('button');b.className='slot '+s;b.innerHTML=times[i]+(s==='booked'?'<small>Booked</small>':s==='held'?'<small>Held</small>':s==='opened'?'<small>Just opened</small>':'<small>Available</small>');b.onclick=()=>choose(i,s);slots.appendChild(b)})}
function choose(i,s){interest[day+'-'+i]=(interest[day+'-'+i]||0)+1;if(s==='available'||s==='opened'){showToast(times[i]+' selected · ready to hold');return} recovery.hidden=false;recoveryTitle.textContent='Checking '+times[i]+' for you…';recoveryText.textContent='This displayed slot is unavailable. Checking additional doctor capacity at the same time.';premiumBtn.textContent='Checking…';premiumBtn.disabled=true;setTimeout(()=>{recoveryTitle.textContent='Same-time option found';recoveryText.textContent=principal+' has additional consultation capacity at '+times[i]+'.';premiumBtn.textContent='Hold '+times[i]+' with senior doctor';premiumBtn.disabled=false;premiumBtn.onclick=()=>showToast(times[i]+' held · continue to payment')},1200)}
function showToast(t){toast.textContent=t;toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),2200)}
setInterval(()=>{initDay(day);const candidates=states[day].map((s,i)=>({s,i})).filter(x=>x.s==='booked'||x.s==='held');if(candidates.length&&Math.random()<.65){const x=candidates[Math.floor(Math.random()*candidates.length)];states[day][x.i]='opened';render();setTimeout(()=>{if(states[day][x.i]==='opened')states[day][x.i]='available';render()},5000)}else{const opens=states[day].map((s,i)=>({s,i})).filter(x=>x.s==='available'&&!protectedTime(times[x.i]));if(opens.length){const x=opens[Math.floor(Math.random()*opens.length)];states[day][x.i]='held';render();setTimeout(()=>{if(states[day][x.i]==='held')states[day][x.i]=Math.random()<.45?'booked':'available';render()},4500)}}},3500);render();
</script></body></html>
